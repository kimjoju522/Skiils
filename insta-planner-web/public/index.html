<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insta Planner</title>
<style>
:root{
  --bg:#F7F5F6;--surface:#FFFFFF;--fg:#221B20;--muted:#6B6168;--line:#E4DDE1;
  --accent:#6B1F4A;--accent-soft:#F1E4EC;--ok:#2E6B4F;--warn:#8A4B10;--warn-soft:#F8ECDD;--code:#F1ECEF;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#19141A;--surface:#231C24;--fg:#F2EBF0;--muted:#A99DA6;--line:#3A2F3C;
  --accent:#E59BC0;--accent-soft:#3A2234;--ok:#7CCBA3;--warn:#E8B06B;--warn-soft:#3A2B17;--code:#2D2430;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7;display:flex;flex-direction:column}
header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700}
header .sub{color:var(--muted);font-size:13px}
.sp{flex:1}
.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.bad{color:var(--warn);border-color:var(--warn)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);}
main.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){main.split{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
#log{flex:1;overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.wrap{max-width:760px;width:100%;margin:0 auto}
.intro h2{font-size:22px;margin:8px 0 6px}
.intro p{color:var(--muted);margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font-size:14px;text-align:left}
.chip:hover{border-color:var(--accent)}
.msg{max-width:100%;min-width:0}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--surface);border-radius:14px 14px 4px 14px;padding:9px 14px;white-space:pre-wrap;max-width:85%}
.msg.a{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 16px;width:100%;overflow-wrap:anywhere}
.msg.a h1,.msg.a h2,.msg.a h3,.msg.a h4{margin:14px 0 6px;line-height:1.35}
.msg.a h1{font-size:19px}.msg.a h2{font-size:17px}.msg.a h3{font-size:16px}.msg.a h4{font-size:15px}
.msg.a p{margin:6px 0}
.msg.a ul,.msg.a ol{margin:6px 0;padding-left:22px}
.msg.a li{margin:3px 0}
.msg.a code{background:var(--code);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:13px}
.msg.a pre{background:var(--code);border-radius:8px;padding:10px 12px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.5}
.msg.a pre code{background:none;padding:0}
.msg.a blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--muted)}
.msg.a a{color:var(--accent)}
.msg.a table{border-collapse:collapse;margin:8px 0;display:block;overflow:auto;font-size:14px}
.msg.a th,.msg.a td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.msg.a th{background:var(--code)}
.msg.a hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.sw{display:inline-block;width:.95em;height:.95em;border-radius:3px;border:1px solid rgba(127,127,127,.5);vertical-align:-.12em;margin-right:4px}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}
.err{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px}
.files{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
footer{border-top:1px solid var(--line);background:var(--surface);padding:12px 18px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.quick .chip{padding:4px 11px;font-size:13px}
.comp{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;min-height:44px;max-height:160px}
#prev{border-left:1px solid var(--line);background:var(--surface)}
#prev .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#prev select{font:inherit;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;max-width:100%}
#prev iframe{flex:1;border:0;width:100%;min-height:0;background:#fff}
#prev a{color:var(--accent);font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>Insta Planner</h1><span class="sub">키워드 한 줄로 인스타 게시물 한 편</span>
  <span class="sp"></span>
  <span id="badge" class="badge">확인 중</span>
  <button id="b-new" class="btn" type="button">새 대화</button>
</header>

<main id="main">
  <section class="col">
    <div id="log" aria-live="polite">
      <div class="wrap intro" id="intro">
        <h2>무슨 게시물을 만들까요?</h2>
        <p>아래 예시를 누르거나 직접 써서 보내세요. 주제 조사부터 카드 문구, 색상, 캡션, 점검까지 차례로 나와요. 중간에 고를 곳에서는 멈추고 물어봐요.</p>
        <div class="chips" id="starters">
          <button class="chip" type="button">겨울 립 키워드로 인스타 게시물 만들고 싶어</button>
          <button class="chip" type="button">요즘 트렌드가 뭐야?</button>
          <button class="chip" type="button">겨울에 딥플럼 색상의 글로스 틴트 브랜드들과 상품을 가져와서 게시물 만들어줘</button>
          <button class="chip" type="button">이번 주 뭐 올리지?</button>
        </div>
        <p class="hint" style="margin-top:16px">이 화면은 내 컴퓨터에서만 열려요. 보내는 말은 이 컴퓨터의 Claude Code로 처리되고, 내 Claude 사용량이 쓰여요. 웹 검색과 페이지 읽기도 해서 한 번에 1~3분 걸릴 수 있어요.</p>
      </div>
    </div>
    <footer>
      <div class="quick" id="quick" hidden></div>
      <div class="comp">
        <textarea id="inp" rows="1" placeholder="요청이나 답을 쓰고 Enter로 보내요 (줄바꿈은 Shift+Enter)" maxlength="4000"></textarea>
        <button id="b-send" class="btn primary" type="button">보내기</button>
        <button id="b-stop" class="btn" type="button" hidden>멈추기</button>
      </div>
    </footer>
  </section>
  <aside id="prev" class="col" hidden aria-label="만들어진 결과 미리보기">
    <div class="bar"><b>결과 미리보기</b><select id="sel" aria-label="파일 선택"></select><a id="open" target="_blank" rel="noopener">새 탭에서 열기</a></div>
    <iframe id="frame" title="결과 미리보기" sandbox="allow-scripts allow-downloads"></iframe>
  </aside>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var log=$('log'),inp=$('inp'),bSend=$('b-send'),bStop=$('b-stop'),quick=$('quick');
var sessionId=null,busy=false,ctl=null,cur=null,curText='',statusEl=null;
try{sessionId=localStorage.getItem('ip_session')||null}catch(e){}

/* ---------- 마크다운(안전하게 변환) ---------- */
function esc(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inl(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/(^|[^&\w])#([0-9A-Fa-f]{6})\b/g,function(m,p,h){return p+'<span class="sw" style="background:#'+h+'"></span>#'+h});
  return s;
}
function md(src){
  var lines=src.replace(/\r/g,'').split('\n'),out=[],i=0;
  while(i<lines.length){
    var l=lines[i];
    if(/^```/.test(l)){var code=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){code.push(lines[i]);i++}i++;out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');continue}
    var h=/^(#{1,4})\s+(.*)$/.exec(l);
    if(h){out.push('<h'+h[1].length+'>'+inl(h[2])+'</h'+h[1].length+'>');i++;continue}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){out.push('<hr>');i++;continue}
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      var head=l.trim().replace(/^\||\|$/g,'').split('|'),rows=[];i+=2;
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(lines[i].trim().replace(/^\||\|$/g,'').split('|'));i++}
      out.push('<table><thead><tr>'+head.map(function(c){return '<th>'+inl(c.trim())+'</th>'}).join('')+'</tr></thead><tbody>'+
        rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inl(c.trim())+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>');continue}
    if(/^\s*>\s?/.test(l)){var q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++}out.push('<blockquote>'+inl(q.join(' '))+'</blockquote>');continue}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){
      var ord=/^\s*\d+\./.test(l),items=[];
      while(i<lines.length&&/^\s*([-*]|\d+\.)\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/,''));i++}
      out.push((ord?'<ol>':'<ul>')+items.map(function(t){return '<li>'+inl(t)+'</li>'}).join('')+(ord?'</ol>':'</ul>'));continue}
    if(!l.trim()){i++;continue}
    var p=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,4}\s|```|\s*\||\s*>|\s*([-*]|\d+\.)\s+)/.test(lines[i])){p.push(lines[i]);i++}
    if(!p.length){p.push(lines[i]);i++}
    out.push('<p>'+p.map(inl).join('<br>')+'</p>');
  }
  return out.join('');
}

/* ---------- 화면 ---------- */
function scroll(){log.scrollTop=log.scrollHeight}
function addUser(t){var d=document.createElement('div');d.className='msg u';d.textContent=t;log.appendChild(d);scroll()}
function newAssistant(){
  var d=document.createElement('div');d.className='msg a';d.hidden=true;log.appendChild(d);cur=d;curText='';
  statusEl=document.createElement('div');statusEl.className='status';statusEl.innerHTML='<span class="dots">생각하는 중</span>';log.appendChild(statusEl);scroll();
}
function setStatus(t){if(statusEl){statusEl.textContent=t;var s=document.createElement('span');s.className='dots';statusEl.appendChild(s)}}
function renderCur(){if(cur){cur.hidden=false;cur.innerHTML=md(curText);scroll()}}
function addErr(t){var d=document.createElement('div');d.className='err';d.textContent=t;log.appendChild(d);scroll()}
function setBusy(b){busy=b;bSend.hidden=b;bStop.hidden=!b;inp.disabled=b;quick.hidden=b||!sessionId}
function showQuick(){
  var items=['1','2','3','4','5','예','아니오','알아서 해줘'];
  quick.innerHTML='';
  items.forEach(function(t){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.onclick=function(){send(t)};quick.appendChild(b)});
  quick.hidden=busy;
}

/* ---------- 보내기(스트리밍) ---------- */
async function send(text){
  text=(text||inp.value).trim();
  if(!text||busy)return;
  var intro=$('intro');if(intro)intro.remove();
  addUser(text);inp.value='';inp.style.height='';
  newAssistant();setBusy(true);
  ctl=new AbortController();
  var gotDone=false;
  try{
    var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Insta-Planner':'1'},body:JSON.stringify({message:text,sessionId:sessionId}),signal:ctl.signal});
    if(!r.ok){var j={};try{j=await r.json()}catch(e){}throw new Error(j.error||'요청에 실패했어요.')}
    var reader=r.body.getReader(),dec=new TextDecoder(),buf='';
    for(;;){
      var chunk=await reader.read();if(chunk.done)break;
      buf+=dec.decode(chunk.value,{stream:true});
      var idx;
      while((idx=buf.indexOf('\n\n'))>=0){var raw=buf.slice(0,idx);buf=buf.slice(idx+2);handleEvent(raw)}
    }
  }catch(e){
    if(e.name!=='AbortError')addErr(e.message||'문제가 생겼어요.');
    else addErr('멈췄어요.');
  }
  function handleEvent(raw){
    var ev='message',data='';raw.split('\n').forEach(function(l){if(l.indexOf('event: ')===0)ev=l.slice(7);else if(l.indexOf('data: ')===0)data+=l.slice(6)});
    var d={};try{d=JSON.parse(data)}catch(e){}
    if(ev==='session'&&d.id){sessionId=d.id;try{localStorage.setItem('ip_session',d.id)}catch(e){}}
    else if(ev==='text'){curText+=d.delta;renderCur()}
    else if(ev==='tool'){setStatus(d.summary||d.name)}
    else if(ev==='done'){gotDone=true;if(d.result&&!curText){curText=d.result;renderCur()}if(d.isError&&!curText)addErr('에이전트가 오류로 끝났어요.')}
    else if(ev==='error'){addErr(d.message||'오류가 났어요.')}
    else if(ev==='files'){showFiles(d.files||[])}
  }
  if(statusEl){statusEl.remove();statusEl=null}
  if(cur&&cur.hidden)cur.remove();
  cur=null;ctl=null;setBusy(false);showQuick();inp.focus();
}

/* ---------- 결과 미리보기 ---------- */
function showFiles(files){
  var html=files.filter(function(f){return /\.html$/i.test(f)});
  if(!html.length)return;
  var sel=$('sel');sel.innerHTML='';
  html.forEach(function(f){var o=document.createElement('option');o.value=f;o.textContent=f;sel.appendChild(o)});
  function load(){var u='/out/'+sel.value.split('/').map(encodeURIComponent).join('/');$('frame').src=u;$('open').href=u}
  sel.onchange=load;sel.value=html[html.length-1];load();
  $('prev').hidden=false;$('main').className='split';
  var d=document.createElement('div');d.className='files';d.textContent='만든 파일: '+files.join(', ');log.appendChild(d);scroll();
}

/* ---------- 이벤트 ---------- */
bSend.onclick=function(){send()};
bStop.onclick=function(){if(ctl)ctl.abort()};
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
inp.addEventListener('input',function(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,160)+'px'});
document.querySelectorAll('#starters .chip').forEach(function(c){c.onclick=function(){send(c.textContent)}});
$('b-new').onclick=function(){
  if(busy&&ctl)ctl.abort();
  sessionId=null;try{localStorage.removeItem('ip_session')}catch(e){}
  location.reload();
};

/* ---------- 상태 확인 ---------- */
fetch('/api/status').then(function(r){return r.json()}).then(function(s){
  var b=$('badge');
  if(!s.claude){b.textContent='Claude Code를 못 찾았어요';b.className='badge bad';bSend.disabled=true;addErr('Claude Code를 찾지 못했어요. README의 "Claude Code 찾기"를 보고 경로를 알려 주세요.');return}
  if(!s.skillInstalled){b.textContent='스킬이 설치되지 않았어요';b.className='badge bad';addErr('insta-planner 스킬이 ~/.claude/skills/ 에 없어요. 스킬 폴더를 그 위치에 복사해 주세요.');return}
  b.textContent='연결됨';b.className='badge ok';
  if(sessionId){showQuick()}
}).catch(function(){var b=$('badge');b.textContent='서버에 연결할 수 없어요';b.className='badge bad'});
})();
</script>
</body>
</html>
